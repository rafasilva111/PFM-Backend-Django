{% for group, options, index in widget.optgroups %}
  {% for option in options %}
    <div class="form-check">
      <input type="checkbox" name="{{ widget.name }}" value="{{ option.value }}" {% if option.selected %}checked{% endif %}
             class="form-check-input" id="{{ widget.attrs.id }}_{{ forloop.counter }}">
      <label class="form-check-label" for="{{ widget.attrs.id }}_{{ forloop.counter }}">
        {{ option.label }}
      </label>
    </div>
  {% endfor %}
{% endfor %}
